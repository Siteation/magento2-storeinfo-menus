name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # The Mage-OS mirror serves magento/* without repo.magento.com credentials.
      - run: composer config repositories.mage-os composer https://mirror.mage-os.org/
      - run: composer update --no-plugins --no-interaction --no-progress
      - run: vendor/bin/phpunit
